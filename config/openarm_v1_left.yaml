# OpenArm V1 Left Arm Configuration
# CAN interface for left arm (follower)

can_interface:
  left_arm: can1

# Joint offsets: convert URDF/IK space to motor space
# motor_pos = urdf_pos + offset
joint_offsets:
  left_arm: [0.0, 0.506145, -1.570796, -1.745329, 0.0, -0.331612, 1.570796, 0.0]

# Motor IDs for left arm (7 DOF + gripper)
arm:
  motor_ids: [1, 2, 3, 4, 5, 6, 7]
  
gripper:
  motor_id: 8

# Control parameters
control:
  kp: 30.0
  kd: 1.0
  timeout_ms: 10
