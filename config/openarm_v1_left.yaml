# OpenArm V1 Left Arm Configuration

# Joint limits for V1 in MODEL SPACE (after offset conversion)
# Note: J4 needs extended range because model-space arms-down = 1.745 rad (100°)
joint_limits:
  right_arm:
    - [-1.5708, 1.5708]     # joint1 - ±90°
    - [-1.5708, 1.5708]     # joint2 - ±90°
    - [-2.0, 2.0]           # joint3 - extended for model-space range
    - [-2.0, 2.0]           # joint4 - extended (elbow needs ~100° for arms-down)
    - [-1.5708, 1.5708]     # joint5 - ±90°
    - [-1.5708, 1.5708]     # joint6 - ±90°
    - [-2.0, 2.0]           # joint7 - extended for model-space range
    - [0.0, 0.044]           # joint8 - V1 gripper slide joint (meters)

  left_arm:
    - [-1.5708, 1.5708]     # joint1 - ±90°
    - [-1.5708, 1.5708]     # joint2 - ±90°
    - [-2.0, 2.0]           # joint3 - extended for model-space range
    - [-2.0, 2.0]           # joint4 - extended (elbow needs ~100° for arms-down)
    - [-1.5708, 1.5708]     # joint5 - ±90°
    - [-1.5708, 1.5708]     # joint6 - ±90°
    - [-2.0, 2.0]           # joint7 - extended for model-space range
    - [0.0, 0.044]           # joint8 - V1 gripper slide joint (meters)

joint_offsets:
  right_arm: [0.0, -0.506145, 1.570796, -1.745329, 0.0, 0.331612, -1.570796, 0.0]
  left_arm: [0.0, 0.506145, -1.570796, -1.745329, 0.0, -0.331612, 1.570796, 0.0]

# Joint delta position limits (rad/s) - reduced for safety
joint_delta_position_limits:
  - 10.0 # J0
  - 10.0 # J1
  - 10.0 # J2
  - 10.0 # J3
  - 10.0 # J4
  - 10.0 # J5
  - 10.0 # J6
  - 10.0 # J7

# CAN interface - matches physical wiring (left=can0, right=can1)
can_interface:
  right_arm: "can1"
  left_arm: "can0"

# Motor configuration - same motors as V2/Cell
motor_config:
  types: ['DM8009', 'DM8009', 'DM4340', 'DM4340', 'DM4310', 'DM4310', 'DM4310', 'DM4310']
  send_ids: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08]
  recv_ids: [0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18]

# Gripper settings
gripper_posforce: true
gripper_posforce_limits: [50.0, 1.0]

# Control gains - J4 (elbow) reduced to prevent overload fault (E)
# High Kp causes torque spikes when position error is large
control_gains:
  kps: [70.0, 70.0, 70.0, 15.0, 10.0, 10.0, 10.0, 10.0]
  kds: [2.75, 2.5, 2.0, 1.0, 0.7, 0.6, 0.5, 0.2]

# Start configuration - compensate for joint offsets so physical position is zero (arms down)
# Physical zero = commanded - offset, so commanded = -offset to get physical zero
start:
  moves:
    - name: "initial"
      position:
        right_arm: [0.0, 0.506145, -1.570796, 1.745329, 0.0, -0.331612, 1.570796, 0.0]
        left_arm: [0.0, -0.506145, 1.570796, 1.745329, 0.0, 0.331612, -1.570796, 0.0]
      hz: 50
      duration: 2

# Stop configuration - same as start (arms down)
stop:
  moves:
    - name: "initial"
      position:
        right_arm: [0.0, 0.506145, -1.570796, 1.745329, 0.0, -0.331612, 1.570796, 0.0]
        left_arm: [0.0, -0.506145, 1.570796, 1.745329, 0.0, 0.331612, -1.570796, 0.0]
      hz: 50
      duration: 2
