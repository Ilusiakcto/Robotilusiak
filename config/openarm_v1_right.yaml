# OpenArm V1 Right Arm Configuration

# Joint limits for V1 - note J2 has ±100° (±1.745 rad) vs V2's different range
joint_limits:
  right_arm:
    - [-1.3, 2.0]           # joint1
    - [-1.745329, 1.745329] # joint2 - V1 specific: ±100°
    - [-1.570796, 1.570796] # joint3
    - [0.15, 2.3]           # joint4 - with safety margin
    - [-1.570796, 1.570796] # joint5
    - [-0.785398, 0.785398] # joint6
    - [-1.570796, 1.570796] # joint7
    - [-1.047198, 0.4]      # joint8 (gripper)

  left_arm:
    - [-2.0, 1.396263]      # joint1
    - [-1.745329, 1.745329] # joint2 - V1 specific: ±100°
    - [-1.570796, 1.570796] # joint3
    - [0.15, 2.3]           # joint4 - with safety margin
    - [-1.570796, 1.570796] # joint5
    - [-0.785398, 0.785398] # joint6
    - [-1.570796, 1.570796] # joint7
    - [-0.4, 1.047198]      # joint8 (gripper)

joint_offsets:
  right_arm: [0.0, -0.506145, 1.570796, -1.745329, 0.0, 0.331612, -1.570796, 0.0]
  left_arm: [0.0, 0.506145, -1.570796, -1.745329, 0.0, -0.331612, 1.570796, 0.0]

# Joint delta position limits (rad/s) - reduced for safety
joint_delta_position_limits:
  - 0.5 # J0 - slower for safety
  - 0.5 # J1
  - 1.0 # J2
  - 0.8 # J3
  - 0.5 # J4 - elbow, very restricted range, keep slow
  - 1.0 # J5
  - 1.0 # J6
  - 1.0 # J7

# CAN interface
can_interface:
  right_arm: "can0"
  left_arm: "can1"

# Motor configuration - same motors as V2/Cell
motor_config:
  types: ['DM8009', 'DM8009', 'DM4340', 'DM4340', 'DM4310', 'DM4310', 'DM4310', 'DM4310']
  send_ids: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08]
  recv_ids: [0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18]

# Gripper settings
gripper_posforce: true
gripper_posforce_limits: [50.0, 1.0]

# Control gains
control_gains:
  kps: [70.0, 70.0, 70.0, 60.0, 10.0, 10.0, 10.0, 10.0]
  kds: [2.75, 2.5, 2.0, 2.0, 0.7, 0.6, 0.5, 0.2]

# Start configuration
start:
  moves:
    - name: "initial"
      position:
        right_arm: [0.0, 0.0, 0.0, 1.5707963267948966, 0.0, 0.0, 0.0, 0.0]
        left_arm: [0.0, 0.0, 0.0, 1.5707963267948966, 0.0, 0.0, 0.0, 0.0]
      hz: 50
      duration: 2

# Stop configuration
stop:
  moves:
    - name: "initial"
      position:
        right_arm: [0.0, 0.0, 0.0, 1.5707963267948966, 0.0, 0.0, 0.0, 0.0]
        left_arm: [0.0, 0.0, 0.0, 1.5707963267948966, 0.0, 0.0, 0.0, 0.0]
      hz: 50
      duration: 2
